<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Customer Sign In — NOVAMART</title>
  <link rel="stylesheet" href="css/style.css">
  <!-- Supabase Official JS SDK CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/data.js" defer></script>
  <script src="js/env.js" defer></script>
  <script src="js/supabase.js" defer></script>
  <script src="js/app.js" defer></script>
</head>
<body style="background:#f1f5f9;">

  <main style="min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px;">
    <div style="background:white; border-radius:var(--radius-lg); padding:40px; width:100%; max-width:440px; box-shadow:var(--shadow-lg); border:1px solid var(--border-store);">
      
      <!-- Brand Logo -->
      <a href="index.html" class="nova-brand" style="justify-content:center; margin-bottom:24px;">
        <div class="brand-icon-box">N</div>
        <div class="brand-text-group">
          <span class="brand-title">NOVAMART</span>
          <span class="brand-tagline">Everything You Need. One Smart Store.</span>
        </div>
      </a>

      <div style="background:rgba(79, 70, 229, 0.08); border-left:4px solid var(--brand-indigo); padding:12px; border-radius:6px; margin-bottom:20px; font-size:0.85rem;">
        🛒 <strong>Customer Store Login</strong>
      </div>

      <form id="customer-login-form" onsubmit="handleCustomerLogin(event)">
        <div style="margin-bottom:16px;">
          <label style="display:block; font-size:0.85rem; font-weight:700; color:var(--brand-navy); margin-bottom:6px;">Customer Email Address</label>
          <input type="email" id="cust-email" placeholder="karthick@novamart.io" value="karthick@novamart.io" style="width:100%; padding:10px; border:1px solid var(--border-store); border-radius:6px;" required />
        </div>
        
        <div style="margin-bottom:20px;">
          <label style="display:block; font-size:0.85rem; font-weight:700; color:var(--brand-navy); margin-bottom:6px;">Password</label>
          <input type="password" id="cust-pass" value="customer123" style="width:100%; padding:10px; border:1px solid var(--border-store); border-radius:6px;" required />
        </div>

        <button type="submit" class="btn-hero" style="width:100%; justify-content:center; background:var(--brand-indigo); color:white;" id="btn-cust-submit">
          Sign In as Customer →
        </button>
      </form>

      <div style="margin-top:24px; text-align:center; font-size:0.85rem; border-top:1px solid var(--border-store); padding-top:16px;">
        <span style="color:var(--text-muted);">Are you a Store Administrator?</span><br />
        <a href="admin-login.html" style="color:var(--brand-indigo); font-weight:700;">Switch to Admin Portal Login →</a>
      </div>
    </div>
  </main>

  <script>
    async function handleCustomerLogin(e) {
      e.preventDefault();
      const email = document.getElementById('cust-email').value.trim();
      const pass = document.getElementById('cust-pass').value;
      const btn = document.getElementById('btn-cust-submit');

      btn.disabled = true;
      btn.textContent = 'Verifying Credentials...';

      const res = await window.novaSupabase.loginCustomer(email, pass);
      if (res.success) {
        window.novaStore.showToast(`Welcome back, ${res.user.email}! Redirecting...`, 'success');
        setTimeout(() => {
          window.location.href = 'index.html';
        }, 800);
      } else {
        btn.disabled = false;
        btn.textContent = 'Sign In as Customer →';
        window.novaStore.showToast(res.error, 'warning');
      }
    }
  </script>
</body>
</html>
