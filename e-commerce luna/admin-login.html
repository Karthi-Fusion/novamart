<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin & DevOps Sign In — NOVAMART</title>
  <link rel="stylesheet" href="css/style.css">
  <!-- Supabase Official JS SDK CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/data.js" defer></script>
  <script src="js/env.js" defer></script>
  <script src="js/supabase.js" defer></script>
  <script src="js/app.js" defer></script>
</head>
<body class="infra-mode" style="background:#090d16;">

  <main style="min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px;">
    <div style="background:#0f172a; border-radius:var(--radius-lg); padding:40px; width:100%; max-width:440px; box-shadow:0 10px 30px rgba(0,0,0,0.5); border:1px solid var(--border-infra);">
      
      <!-- Brand Logo -->
      <a href="index.html" class="nova-brand" style="justify-content:center; margin-bottom:24px;">
        <div class="brand-icon-box" style="background:linear-gradient(135deg, var(--brand-cyan), var(--brand-indigo));">⚡</div>
        <div class="brand-text-group">
          <span class="brand-title" style="color:white;">NOVAMART</span>
          <span class="brand-tagline" style="color:var(--brand-cyan);">ADMIN & DEVOPS PORTAL</span>
        </div>
      </a>

      <div style="background:rgba(6, 182, 212, 0.1); border-left:4px solid var(--brand-cyan); padding:12px; border-radius:6px; margin-bottom:20px; font-size:0.85rem; color:var(--brand-cyan);">
        🔐 <strong>Restricted Access: Store Operations & Infrastructure</strong>
      </div>

      <form id="admin-login-form" onsubmit="handleAdminLogin(event)">
        <div style="margin-bottom:16px;">
          <label style="display:block; font-size:0.85rem; font-weight:700; color:#cbd5e1; margin-bottom:6px;">Admin Email Address</label>
          <input type="email" id="admin-email" placeholder="admin@novamart.io" value="admin@novamart.io" style="width:100%; padding:10px; border:1px solid var(--border-infra); background:#1e293b; color:white; border-radius:6px;" required />
        </div>
        
        <div style="margin-bottom:20px;">
          <label style="display:block; font-size:0.85rem; font-weight:700; color:#cbd5e1; margin-bottom:6px;">Admin Password</label>
          <input type="password" id="admin-pass" value="admin123" style="width:100%; padding:10px; border:1px solid var(--border-infra); background:#1e293b; color:white; border-radius:6px;" required />
        </div>

        <button type="submit" class="btn-hero" style="width:100%; justify-content:center; background:var(--brand-cyan); color:var(--brand-navy);" id="btn-admin-submit">
          Sign In to Admin Operations →
        </button>
      </form>

      <div style="margin-top:24px; text-align:center; font-size:0.85rem; border-top:1px solid var(--border-infra); padding-top:16px;">
        <span style="color:#94a3b8;">Are you a Customer?</span><br />
        <a href="login.html" style="color:var(--brand-cyan); font-weight:700;">Switch to Customer Store Login →</a>
      </div>
    </div>
  </main>

  <script>
    async function handleAdminLogin(e) {
      e.preventDefault();
      const email = document.getElementById('admin-email').value.trim();
      const pass = document.getElementById('admin-pass').value;
      const btn = document.getElementById('btn-admin-submit');

      btn.disabled = true;
      btn.textContent = 'Authenticating Admin Privileges...';

      const res = await window.novaSupabase.loginAdmin(email, pass);
      if (res.success) {
        window.novaStore.showToast(`Admin Authenticated! Welcome, ${res.user.email}`, 'success');
        setTimeout(() => {
          window.location.href = 'admin.html';
        }, 800);
      } else {
        btn.disabled = false;
        btn.textContent = 'Sign In to Admin Operations →';
        window.novaStore.showToast(res.error, 'warning');
      }
    }
  </script>
</body>
</html>
